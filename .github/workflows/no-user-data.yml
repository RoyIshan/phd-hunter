name: no user data in PRs

# Personal folders are git-ignored, but `git add -f` can still force them in.
# This fails any pull request that adds or changes a file there.
on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Reject personal files
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          bad=0
          while IFS= read -r -d '' f; do
            case "$f" in
              profile/README.md|documents/README.md) continue ;;
            esac
            if printf '%s' "$f" | grep -Eq '^(profile/|data/|reports/|output/|documents/|config/search\.json$|dashboard\.html$)|\.(eml|mbox)$'; then
              echo "::error file=$f::Personal data does not belong in this repository. Remove it from the pull request."
              bad=1
            fi
          done < <(git diff -z --name-only --diff-filter=ACMR "$BASE" HEAD)
          exit $bad
