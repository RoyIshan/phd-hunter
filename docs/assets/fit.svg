<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 566" width="1200" height="566" role="img" aria-labelledby="t d">
<title id="t">Eligibility gates, weighted fit score and verdict bands</title>
<desc id="d">Eight gates run first: open, doctoral role, funding, degree, MSCA mobility, language, credits and grades, deal-breakers. A failed gate caps the score at 2.0. Then seven weighted dimensions: research fit 30, methods fit 15, eligibility 15, supervisor and group 15, funding 10, odds 10, place and life 5. Verdict: below 3.5 skip, 3.5 to 3.7 maybe, 3.8 to 4.2 apply, 4.3 to 5.0 apply with priority.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080d1a"/><stop offset="1" stop-color="#101830"/></linearGradient></defs>
<style>
.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
