ill="none" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="292" y="247" class="s" font-size="14" font-weight="600" fill="#e8edf8">Degree</text><rect x="76" y="274" width="168" height="40" rx="10" fill="#080d1a" stroke="#26335c"/><circle cx="96" cy="294" r="6" fill="none" stroke="#2dd4bf" stroke-width="2"/><path d="M93 294 l2.4 2.6 l4.4 -5" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="112" y="299" class="s" font-size="14" font-weight="600" fill="#e8edf8">MSCA mobility</text><rect x="256" y="274" width="168" height="40" rx="10" fill="#080d1a" stroke="#26335c"/><circle cx="276" cy="294" r="6" fill="none" stroke="#2dd4bf" stroke-width="2"/><path d="M273 294 l2.4 2.6 l4.4 -5" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="292" y="299" class="s" font-size="14" font-weight="600" fill="#e8edf8">Language</text><rect x="76" y="326" width="168" height="40" rx="10" fill="#080d1a" stroke="#26335c"/><circle cx="96" cy="346" r="6" fill="none" stroke="#2dd4bf" stroke-width="2"/><path d="M93 346 l2.4 2.6 l4.4 -5" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="112" y="351" class="s" font-size="14" font-weight="600" fill="#e8edf8">Credits and grades</text><rect x="256" y="326" width="168" height="40" rx="10" fill="#080d1a" stroke="#26335c"/><circle cx="276" cy="346" r="6" fill="none" stroke="#2dd4bf" stroke-width="2"/><path d="M273 346 l2.4 2.6 l4.4 -5" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="292" y="351" class="s" font-size="14" font-weight="600" fill="#e8edf8">Deal-breakers</text><text x="76" y="402" class="s" font-size="14" fill="#e8edf8">Any failed gate caps the score at <tspan font-weight="700" fill="#f87171">2.0</tspan>.</text><text x="76" y="426" class="s" font-size="14" fill="#8d9ac0">Unknown is not a pass. It becomes <tspan class="m" font-weight="700" fill="#fbbf24">CHECK</tspan>.</text><path d="M462 282 H502" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round"/><path d="M494 272 L506 282 L494 292 Z" fill="#2dd4bf"/><rect x="520" y="112" width="628" height="340" rx="18" fill="#131c38" stroke="#26335c"/><text x="544" y="148" class="s" font-size="13" font-weight="700" letter-spacing="2.5" fill="#a78bfa">SEVEN WEIGHTED DIMENSIONS</text><text x="544" y="183" class="s" font-size="15" fill="#e8edf8">Research fit</text><rect x="810" y="170" width="250" height="14" rx="7" fill="#080d1a" stroke="#26335c"/><rect x="810" y="170" width="250.0" height="14" rx="7" fill="#a78bfa" fill-opacity="1.00"/><text x="1082" y="183" class="m" font-size="15" font-weight="700" fill="#e8edf8">30%</text><text x="544" y="221" class="s" font-size="15" fill="#e8edf8">Methods fit</text><rect x="810" y="208" width="250" height="14" rx="7" fill="#080d1a" stroke="#26335c"/><rect x="810" y="208" width="125.0" height="14" rx="7" fill="#a78bfa" fill-opacity="0.78"/><text x="1082" y="221" class="m" font-size="15" font-weight="700" fill="#e8edf8">15%</text><text x="544" y="259" class="s" font-size="15" fill="#e8edf8">Eligibility and requirements</text><rect x="810" y="246" width="250" height="14" rx="7" fill="#080d1a" stroke="#26335c"/><rect x="810" y="246" width="125.0" height="14" rx="7" fill="#a78bfa" fill-opacity="0.78"/><text x="1082" y="259" class="m" font-size="15" font-weight="700" fill="#e8edf8">15%</text><text x="544" y="297" class="s" font-size="15" fill="#e8edf8">Supervisor and group</text><rect x="810" y="284" width="250" height="14" rx="7" fill="#080d1a" stroke="#26335c"/><rect x="810" y="284" width="125.0" height="14" rx="7" fill="#a78bfa" fill-opacity="0.78"/><text x="1082" y="297" class="m" font-size="15" font-weight="700" fill="#e8edf8">15%</text><text x="544" y="335" class="s" font-size="15" fill="#e8edf8">Funding and conditions</text><rect x="810" y="322" width="250" height="14" rx