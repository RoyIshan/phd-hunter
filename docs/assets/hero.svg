<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t d">
<title id="t">phd-hunter</title>
<desc id="d">Banner: a radar sweeping over blips labelled with European country codes. phd-hunter, a local PhD hunter for Europe. You read everything. You press submit.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080d1a"/><stop offset="1" stop-color="#101830"/></linearGradient><linearGradient id="wedge" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf" stop-opacity="0.0"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0.38"/></linearGradient><pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#26335c" fill-opacity="0.55"/></pattern></defs>
<style>
.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}

.sweep{transform-origin:960px 212px;animation:sw 7s linear infinite}
@keyframes sw{to{transform:rotate(360deg)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pl 3.6s ease-out infinite}
@keyframes pl{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.6);opacity:0}}
</style>
