"0" r="14"/><path d="M-26 0H-10M10 0H26M0 -26V-10M0 10V26"/><circle cx="0" cy="0" r="3" fill="#2dd4bf" stroke="none"/></g><text x="104" y="104" class="s" font-size="15" font-weight="700" letter-spacing="3.5" fill="#2dd4bf">FOR EUROPE · LOCAL · OPEN SOURCE</text><text x="60" y="196" class="s" font-size="80" font-weight="800" letter-spacing="-3" fill="#e8edf8">phd-hunter</text><text x="62" y="244" class="s" font-size="27" font-weight="600" fill="#e8edf8">Find funded PhD positions across Europe.</text><text x="62" y="278" class="s" font-size="19" fill="#8d9ac0">Check eligibility. Research the people. Draft in your own voice.</text><text x="62" y="316" class="s" font-size="21" font-weight="700" fill="#fbbf24">You read everything. You press submit.</text><rect x="62.0" y="356" width="220.8" height="32" rx="16" fill="#2dd4bf" fill-opacity="0.12" stroke="#2dd4bf" stroke-opacity="0.55"/><text x="172.38" y="377" text-anchor="middle" class="s" font-size="14" font-weight="600" fill="#2dd4bf">Eligibility gates first</text><rect x="296.8" y="356" width="212.6" height="32" rx="16" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-opacity="0.55"/><text x="403.08" y="377" text-anchor="middle" class="s" font-size="14" font-weight="600" fill="#a78bfa">Supervisors researched</text><rect x="523.4" y="356" width="220.8" height="32" rx="16" fill="#4ade80" fill-opacity="0.12" stroke="#4ade80" stroke-opacity="0.55"/><text x="633.78" y="377" text-anchor="middle" class="s" font-size="14" font-weight="600" fill="#4ade80">Checked against your CV</text>
</svg>
