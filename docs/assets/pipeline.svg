x="250.0" y="218" text-anchor="middle" class="s" font-size="11.5" fill="#8d9ac0">9 boards, parallel</text><rect x="332" y="144" width="116" height="84" rx="14" fill="#131c38" stroke="#60a5fa" stroke-opacity="0.7" stroke-width="1.5"/><circle cx="352" cy="164" r="11" fill="#60a5fa" fill-opacity="0.18" stroke="#60a5fa"/><text x="352" y="169" text-anchor="middle" class="m" font-size="13" font-weight="700" fill="#60a5fa">3</text><text x="390.0" y="199" text-anchor="middle" class="m" font-size="16" font-weight="700" fill="#e8edf8">/rank</text><text x="390.0" y="218" text-anchor="middle" class="s" font-size="11.5" fill="#8d9ac0">short-form scores</text><rect x="472" y="144" width="116" height="84" rx="14" fill="#131c38" stroke="#60a5fa" stroke-opacity="0.7" stroke-width="1.5"/><circle cx="492" cy="164" r="11" fill="#60a5fa" fill-opacity="0.18" stroke="#60a5fa"/><text x="492" y="169" text-anchor="middle" class="m" font-size="13" font-weight="700" fill="#60a5fa">4</text><text x="530.0" y="199" text-anchor="middle" class="m" font-size="16" font-weight="700" fill="#e8edf8">/evaluate</text><text x="530.0" y="218" text-anchor="middle" class="s" font-size="11.5" fill="#8d9ac0">gates, fit, people</text><rect x="612" y="144" width="116" height="84" rx="14" fill="#131c38" stroke="#a78bfa" stroke-opacity="0.7" stroke-width="1.5"/><circle cx="632" cy="164" r="11" fill="#a78bfa" fill-opacity="0.18" stroke="#a78bfa"/><text x="632" y="169" text-anchor="middle" class="m" font-size="13" font-weight="700" fill="#a78bfa">5</text><text x="670.0" y="199" text-anchor="middle" class="m" font-size="16" font-weight="700" fill="#e8edf8">/outreach</text><text x="670.0" y="218" text-anchor="middle" class="s" font-size="11.5" fill="#8d9ac0">briefs and drafts</text><rect x="752" y="144" width="116" height="84" rx="14" fill="#131c38" stroke="#a78bfa" stroke-opacity="0.7" stroke-width="1.5"/><circle cx="772" cy="164" r="11" fill="#a78bfa" fill-opacity="0.18" stroke="#a78bfa"/><text x="772" y="169" text-anchor="middle" class="m" font-size="13" font-weight="700" fill="#a78bfa">6</text><text x="810.0" y="199" text-anchor="middle" class="m" font-size="16" font-weight="700" fill="#e8edf8">/apply</text><text x="810.0" y="218" text-anchor="middle" class="s" font-size="11.5" fill="#8d9ac0">CV, letter, pack</text><rect x="892" y="144" width="116" height="84" rx="14" fill="#131c38" stroke="#fbbf24" stroke-opacity="0.7" stroke-width="1.5"/><circle cx="912" cy="164" r="11" fill="#fbbf24" fill-opacity="0.18" stroke="#fbbf24"/><text x="912" y="169" text-anchor="middle" class="m" font-size="13" font-weight="700" fill="#fbbf24">7</text><text x="950.0" y="199" text-anchor="middle" class="m" font-size="16" font-weight="700" fill="#e8edf8">/interview</text><text x="950.0" y="218" text-anchor="middle" class="s" font-size="11.5" fill="#8d9ac0">panel and mock</text><rect x="1032" y="144" width="116" height="84" rx="14" fill="#131c38" stroke="#4ade80" stroke-opacity="0.7" stroke-width="1.5"/><circle cx="1052" cy="164" r="11" fill="#4ade80" fill-opacity="0.18" stroke="#4ade80"/><text x="1052" y="169" text-anchor="middle" class="m" font-size="13" font-weight="700" fill="#4ade80">8</text><text x="1090.0" y="199" text-anchor="middle" class="m" font-size="16" font-weight="700" fill="#e8edf8">/status</text><text x="1090.0" y="218" text-anchor="middle" class="s" font-size="11.5" fill="#8d9ac0">deadlines, funnel</text><line x1="250.0" y1="228" x2="250.0" y2="268" stroke="#26335c" stroke-width="2" stroke-dasharray="3 4"/><rect x="202.0" y="268" width="96" height="32" rx="16" fill="#080d1a" stroke="#26335c"/><text x="250.0" y="289" text-anchor="middle" class="m" font-size="13" font-weight="700" fill="#e8edf8">/digest</text><text x="250.0" y="318" text-anchor="middle" class="s" font-size="11.5" fill="#8d9ac0">routine check</text><line x1="530.0" y1="228" x2="530.0" y2="268" stroke="#26335c" stroke-width="2" stroke-dasharray="3 4"/><rect x="482.0" y="268" width="96" height="32" rx="16" fill="#080d1a" stroke="#26335c"/><text x="530.0" y="289" text-anchor="middle" class="m" font-size="13" font-weight="700" fill="#e8edf8">/compare</text><text x="530.0" y="318" text-anchor="middle" class="s" font-size="11.5" fill="#8d9ac0">2 to 6, side by side</text><line x1="670.0" y1="128" x2="670.0" y2="144" stroke="#26335c" stroke-width="2" stroke-dasharray="3 4"/><rect x="622.0" y="96" width="96" height="32" rx="16" fill="#080d1a" stroke="#26335c"/><text x="670.0" y="117" text-anchor="middle" class="m" font-size="13" font-weight="700" fill="#e8edf8">/prospect</text><text x="670.0" y="88" text-anchor="middle" class="s" font-size="11.5" fill="#8d9ac0">before an advert exists</text><line x1="810.0" y1="228" x2="810.0" y2="268" stroke="#26335c" stroke-width="2" stroke-dasharray="3 4"/><rect x="762.0" y="268" width="96" height="32" rx="16" fill="#080d1a" stroke="#26335c"/><text x="810.0" y="289" text-anchor="middle" class="m" font-size="13" font-weight="700" fill="#e8edf8">/proposal</text><text x="810.0" y="318" text-anchor="middle" class="s" font-size="11.5" fill="#8d9ac0">from papers you read</text><line x1="1090.0" y1="228" x2="1090.0" y2="268" stroke="#26335c" stroke-width="2" stroke-dasharray="3 4"/><rect x="1042.0" y="268" width="96" height="32" rx="16" fill="#080d1a" stroke="#26335c"/><text x="1090.0" y="289" text-anchor="middle" class="m" font-size="13" font-weight="700" fill="#e8edf8">/inbox</text><text x="1090.0" y="318" text-anchor="middle" class="s" font-size="11.5" fill="#8d9ac0">mail to tracker updates</text><rect x="52" y="340" width="1096" height="44" rx="12" fill="#fbbf24" fill-opacity="0.09" stroke="#fbbf24" stroke-opacity="0.45"/><text x="600.0" y="368" text-anchor="middle" class="s" font-size="16" font-weight="600" fill="#e8edf8">Every stop ends in a draft or a recommendation. <tspan fill="#fbbf24">Deciding, sending and submitting stay yours.</tspan></text>
</svg>
