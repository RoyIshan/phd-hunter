<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 408" width="1200" height="408" role="img" aria-labelledby="t d">
<title id="t">The phd-hunter route</title>
<desc id="d">Eight stops: setup, scan, rank, evaluate, outreach, apply, interview, status. Side roads: digest, compare, prospect, proposal, inbox. Deciding, sending and submitting stay with the candidate.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080d1a"/><stop offset="1" stop-color="#101830"/></linearGradient></defs>
<style>
.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
.flow{animation:fl 1.4s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}</style>
